<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#glow)" opacity="0.35"/>
  <!-- Broken/liberated outer ring: two arcs with a gap = "exiled" -->
  <path d="M 64 12 A 52 52 0 1 1 22 88" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 106 40 A 52 52 0 0 1 92 108" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner core hexagon -->
  <polygon points="64,28 94,46 94,82 64,100 34,82 34,46" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <!-- Liberated "E" core -->
  <g stroke="url(#g)" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="46" y1="44" x2="46" y2="84"/>
    <line x1="46" y1="44" x2="78" y2="44"/>
    <line x1="46" y1="64" x2="72" y2="64"/>
    <line x1="46" y1="84" x2="78" y2="84"/>
  </g>
  <circle cx="64" cy="64" r="3" fill="#22d3ee"/>
</svg>
